<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 - Tabela</title>
	</head>
	<body>
		<!-- table -> tabela -->
		<!-- Iniciando a tabela -->
	<table border="1" width="100%">
			<!-- thead -> table head -> cabeçalho da tabela -->
		<thead style="background-color: #00FF7F; color: #000;">
				<!-- Criando a primeira linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<!-- th -> table head -> cabeçalho -->
					<th colspan="5">Tabela de Serviços Mecânicos</th>
				</tr>
			</tr>
		</thead>
		<!-- tbody -> table body -> corpo da tabela -->
		<tbody>
			<!-- Criando a segunda linha -->
			<!-- linha da tabela -> table row -> tr -->
			<tr>
				<!-- td -> table data -> dados da tabela -->
				<td rowspan="5" style="background-color: #4682B4">Nacionais</td>
				<td style="background-color: #D3D3D3">Veículos</td>
				<td style="background-color: #D3D3D3">Serviço</td>
				<td style="background-color: #D3D3D3">Tempo Previsto</td>
				<td style="background-color: #D3D3D3">Valor</td>
			</tr>
			
			<!-- Criando a terceira linha -->
			<!-- linha da tabela -> table row -> tr -->
			<tr>
				<td>Caminhonte S10</td>
				<td>Suspensão</td>
				<td>3 horas e 25 minutos</td>
				<td>350,00</td>
			</tr>
			
			
			<!-- Criando a quinta linha -->
			<tr>
				<td>Caminhonte Ranger</td>
				<td>Freio</td>
				<td>3 horas e 45 minutos</td>
				<td>200,00</td>
			</tr>
			
			<!-- Criando a sexta linha -->
			<tr>
				<td>Caminhonte Hilux</td>
				<td>Troca de bateria</td>
				<td>30 minutos</td>
				<td>25,0</td>
			</tr>
			
			<!-- Criando a sétima linha -->
			<tr>
				<td>Caminhonete D10</td>
				<td>Alinhamento</td>
				<td>1 hora e 40 minutos</td>
				<td>220,0</td>
			</tr>
		</tbody>
	</table>
	</body>
</html>
